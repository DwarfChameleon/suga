<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>SUGA</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="preconnect" href="https://suga-server.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="//suga-server.onrender.com" />
  <style>
    #suga-startup-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      place-items: center;
      gap: 14px;
      background: #ffffff;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #suga-startup-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    #suga-startup-overlay img {
      width: 122px;
      height: 122px;
      object-fit: contain;
      animation: sugaStartupPulse 1.05s ease-in-out infinite;
      transform-origin: center;
    }

    .suga-startup-name {
      margin-top: 4px;
      color: #ff2854;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }

    .suga-startup-credit {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      color: #8b95a1;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
    }

    @keyframes sugaStartupPulse {
      0%, 100% {
        transform: scale(0.92);
      }
      50% {
        transform: scale(1.12);
      }
    }

    html:not(.hydrated) body {
      display: block !important;
    }

    html:not(.hydrated) app-root {
      visibility: hidden;
    }

    html:not(.hydrated) #suga-startup-overlay {
      visibility: visible;
    }
  </style>

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <div id="suga-startup-overlay" aria-label="SUGA loading">
    <img src="assets/sugalogo.png" alt="SUGA" />
    <div class="suga-startup-name">SUGA</div>
    <div class="suga-startup-credit">by<br />oneKobo Technologies</div>
  </div>
  <app-root></app-root>
</body>

</html>
