<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content class="intro-bg">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($event)">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline" refreshingSpinner="dots"></ion-refresher-content>
  </ion-refresher>
  <div class="registration-hero">
    <h2 class="hero-title">Create your Suga profile</h2>
    <p class="hero-sub">Pick the role that matches how you want to use Suga.</p>
  </div>

  <div class="role-grid">
    <div class="role-card consumer-card" role="button" tabindex="0" (click)="selectRole('consumer')" (keydown.enter)="selectRole('consumer')" (keydown.space)="selectRole('consumer'); $event.preventDefault()">
      <button class="info-btn" type="button" aria-label="Consumer role information" [attr.aria-expanded]="activeInfoRole === 'consumer'" (click)="toggleRoleInfo('consumer', $event)">
        <ion-icon name="information-circle-outline"></ion-icon>
      </button>
      <div class="role-icon">
        <ion-icon name="fast-food-outline"></ion-icon>
      </div>
      <h3>Consumer</h3>
      <div class="role-callout" *ngIf="activeInfoRole === 'consumer'" (click)="$event.stopPropagation()">
        {{ roleInfo.consumer }}
      </div>
    </div>

    <div class="role-card chef-card" role="button" tabindex="0" (click)="selectRole('chef')" (keydown.enter)="selectRole('chef')" (keydown.space)="selectRole('chef'); $event.preventDefault()">
      <button class="info-btn" type="button" aria-label="Chef role information" [attr.aria-expanded]="activeInfoRole === 'chef'" (click)="toggleRoleInfo('chef', $event)">
        <ion-icon name="information-circle-outline"></ion-icon>
      </button>
      <div class="role-icon">
        <ion-icon name="restaurant-outline"></ion-icon>
      </div>
      <h3>Chef</h3>
      <div class="role-callout" *ngIf="activeInfoRole === 'chef'" (click)="$event.stopPropagation()">
        {{ roleInfo.chef }}
      </div>
    </div>

    <div class="role-card dispatch-card" role="button" tabindex="0" (click)="selectRole('dispatch')" (keydown.enter)="selectRole('dispatch')" (keydown.space)="selectRole('dispatch'); $event.preventDefault()">
      <button class="info-btn" type="button" aria-label="Dispatch role information" [attr.aria-expanded]="activeInfoRole === 'dispatch'" (click)="toggleRoleInfo('dispatch', $event)">
        <ion-icon name="information-circle-outline"></ion-icon>
      </button>
      <div class="role-icon">
        <ion-icon name="bicycle-outline"></ion-icon>
      </div>
      <h3>Dispatch Rider</h3>
      <div class="role-callout" *ngIf="activeInfoRole === 'dispatch'" (click)="$event.stopPropagation()">
        {{ roleInfo.dispatch }}
      </div>
    </div>
  </div>

</ion-content>
