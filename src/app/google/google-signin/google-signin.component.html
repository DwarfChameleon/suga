<div class="google-signin-wrapper">
  <p class="google-divider-copy">
    {{ context === 'register' ? 'or Sign up with Google' : 'or Sign in with Google' }}
  </p>
  <div *ngIf="!isNativeApp" #googleButtonContainer class="google-button-host"></div>
  <button *ngIf="isNativeApp" type="button" class="native-google-button" [disabled]="isNativeBusy" (click)="signInWithNativeGoogle()">
    <span class="google-mark" aria-hidden="true">G</span>
    <span class="native-google-copy">{{ isNativeBusy ? 'Opening Google...' : (context === 'register' ? 'Sign up with Google' : 'Sign in with Google') }}</span>
  </button>
</div>
