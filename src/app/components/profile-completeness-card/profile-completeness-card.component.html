<div class="profile-completeness-card" *ngIf="profile">
  <div class="card-header">
    <div>
      <h3>Profile Completeness</h3>
      <p>{{ percent }}% complete</p>
    </div>
    <button class="cta-btn" (click)="openProfile()" [disabled]="percent === 100">
      {{ percent === 100 ? 'Complete' : 'Finish Now' }}
    </button>
  </div>

  <div class="progress-track">
    <div class="progress-fill" [style.width.%]="percent"></div>
  </div>

  <div class="missing-list" *ngIf="missingItems.length > 0; else allDone">
    <button type="button" *ngFor="let item of visibleMissingItems" class="missing-chip" (click)="toggleMissingList()">{{ item }}</button>
    <button type="button" *ngIf="missingItems.length > 4" class="missing-chip more" (click)="toggleMissingList()">
      {{ showAllMissing ? 'Show less' : ('+' + (missingItems.length - 4) + ' more') }}
    </button>
  </div>

  <ng-template #allDone>
    <div class="done-message">Nice. Your profile is complete.</div>
  </ng-template>
</div>
